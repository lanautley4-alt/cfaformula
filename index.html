<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFA Formula Board</title>
  <link rel="stylesheet" href="style.css" />
  <script src="math.js"></script>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-left">
    <span class="logo">CFA Formulas</span>
  </div>
  <div class="header-right">
    <button id="btnPractice" class="btn btn-accent" onclick="openFlashcards()">Practice Flashcards</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ New Formula</button>
  </div>
</header>

<!-- ===== CATEGORY FILTER ===== -->
<div class="toolbar">
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search formulas…" oninput="renderBoard()" />
  </div>
  <div class="filter-wrap" id="categoryFilters">
    <button class="filter-btn active" onclick="setFilter('all')">All</button>
  </div>
</div>

<!-- ===== KANBAN BOARD ===== -->
<main id="board" class="board"></main>

<!-- ===== ADD / EDIT MODAL ===== -->
<div id="formulaModal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">New Formula</h2>

    <label>Title <span class="req">*</span></label>
    <input id="fTitle" type="text" placeholder="e.g. Sharpe Ratio" />

    <label>Category <span class="req">*</span></label>
    <select id="fCategory" onchange="onCatSelectChange()">
      <option value="">— Select a category —</option>
      <option>Ethical and Professional Standards</option>
      <option>Quantitative Methods</option>
      <option>Economics</option>
      <option>Financial Statement Analysis</option>
      <option>Corporate Issuers</option>
      <option>Equity Investments</option>
      <option>Fixed Income</option>
      <option>Derivatives</option>
      <option>Alternative Investments</option>
      <option>Portfolio Management &amp; Wealth Planning</option>
      <option value="__custom__">Other / Custom…</option>
    </select>
    <input id="fCategoryCustom" type="text" placeholder="Enter custom category name" class="hidden" style="margin-top:6px" />

    <label>Formula <span class="req">*</span>
      <span class="hint">Use LaTeX — e.g. <code>\frac{r-r_f}{\sigma}</code></span>
    </label>
    <textarea id="fFormula" rows="3" placeholder="$$\frac{r - r_f}{\sigma}$$"></textarea>

    <label>Description / Notes</label>
    <textarea id="fDesc" rows="3" placeholder="Optional notes, context, variables explained…"></textarea>

    <div class="latex-helper">
      <span class="helper-label">Quick inserts:</span>
      <button type="button" onclick="insertLatex('\\frac{a}{b}')">a/b</button>
      <button type="button" onclick="insertLatex('a^{n}')">a^n</button>
      <button type="button" onclick="insertLatex('\\sqrt{x}')">√x</button>
      <button type="button" onclick="insertLatex('\\sum_{i=1}^{n}')">Σ</button>
      <button type="button" onclick="insertLatex('\\prod_{i=1}^{n}')">Π</button>
      <button type="button" onclick="insertLatex('\\left(1+r\\right)^{n}')"><small>(1+r)^n</small></button>
      <button type="button" onclick="insertLatex('\\Delta')">Δ</button>
      <button type="button" onclick="insertLatex('\\times')">×</button>
      <button type="button" onclick="insertLatex('\\pm')">±</button>
    </div>

    <div class="preview-box" id="fPreview">
      <span class="preview-label">Preview</span>
      <div id="previewContent"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveFormula()">Save</button>
    </div>
  </div>
</div>

<!-- ===== FLASHCARD MODAL ===== -->
<div id="flashcardModal" class="modal-overlay hidden">
  <div class="modal modal-fc">
    <div class="fc-header">
      <h2>Practice Mode</h2>
      <div class="fc-controls">
        <label>Category:
          <select id="fcCatSelect" onchange="startDeck()">
            <option value="all">All</option>
          </select>
        </label>
        <button class="btn btn-ghost" onclick="closeFlashcards()">✕ Exit</button>
      </div>
    </div>

    <div class="fc-progress">
      <span id="fcCounter">0 / 0</span>
      <div class="progress-bar"><div id="progressFill"></div></div>
    </div>

    <!-- Card — fade-flip (no 3D, so MathJax renders correctly) -->
    <div class="fc-card-wrap" id="fcCardWrap">
      <div class="fc-card" id="fcCard" onclick="flipCard()">
        <!-- FRONT -->
        <div class="fc-face fc-front" id="fcFront">
          <p class="fc-prompt">What is the formula for…</p>
          <h3 id="fcTitle"></h3>
          <p class="fc-tap">tap to reveal</p>
        </div>
        <!-- BACK -->
        <div class="fc-face fc-back fc-hidden" id="fcBack">
          <div id="fcFormula" class="fc-formula-display"></div>
          <p id="fcDesc" class="fc-desc"></p>
        </div>
      </div>
    </div>

    <div class="fc-nav">
      <button class="btn btn-ghost" onclick="prevCard()">← Prev</button>
      <button class="btn btn-accent" onclick="flipCard()" id="btnFlip">Flip</button>
      <button class="btn btn-primary" onclick="nextCard()">Next →</button>
    </div>

    <div class="fc-self-grade hidden" id="fcSelfGrade">
      <p>Did you get it?</p>
      <button class="btn btn-success" onclick="gradeCard(true)">✓ Got it</button>
      <button class="btn btn-danger"  onclick="gradeCard(false)">✗ Review again</button>
    </div>

    <div class="fc-done hidden" id="fcDone">
      <h3>Round complete!</h3>
      <p id="fcScore"></p>
      <button class="btn btn-primary" onclick="startDeck()">Restart</button>
      <button class="btn btn-accent"  onclick="startDeck(true)">Only missed</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="app.js"></script>
<!-- SortableJS is optional (drag-drop); app works fine without it -->
</body>
</html>
